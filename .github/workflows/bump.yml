name: Bump cask

# KwikPaste 发布正式版后，把 cask 的版本号和两个 DMG 的 sha256 改到新版本，再启动测试。
# 每小时检查一次；发版后想立刻更新：gh workflow run bump.yml -R ManSanDADADA/homebrew-tap
# cask 标了 auto_updates，应用会自己更新，这里慢一点只影响新装用户拿到的初始版本。

"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "KwikPaste release tag, e.g. v1.3.7; empty for the latest stable release"
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

env:
  CASK_FILE: Casks/kwikpaste.rb
  UPSTREAM: ManSanDADADA/KwikPaste

jobs:
  bump:
    name: Bump cask
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version and checksums
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$(gh release view --repo "${UPSTREAM}" --json tagName --jq .tagName)}"
          version="${tag#v}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "${CASK_FILE}")"

          if [[ "${version}" == "${current}" ]]; then
            echo "Cask is already at ${version}."
            exit 0
          fi

          # 直接下载 brew 实际会用的地址：刚发布的几分钟里按 tag 查到的资产表可能是空的，这个地址不受影响。
          declare -A sha
          for arch in aarch64 x64; do
            curl -fsSL --retry 3 -o "${arch}.dmg" \
              "https://github.com/${UPSTREAM}/releases/download/${tag}/KwikPaste_${version}_${arch}.dmg"
            sha[$arch]="$(sha256sum "${arch}.dmg" | cut -d' ' -f1)"
            rm "${arch}.dmg"
          done

          sed -i -E \
            -e "s/^  version \".*\"$/  version \"${version}\"/" \
            -e "s/(arm: +)\"[0-9a-f]{64}\"/\1\"${sha[aarch64]}\"/" \
            -e "s/(intel: )\"[0-9a-f]{64}\"/\1\"${sha[x64]}\"/" \
            "${CASK_FILE}"

          grep -q "version \"${version}\"" "${CASK_FILE}"
          grep -q "${sha[aarch64]}" "${CASK_FILE}"
          grep -q "${sha[x64]}" "${CASK_FILE}"
          git diff

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit and start tests
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kwikpaste ${VERSION}"
          git push

          # github.token 推送的提交不会触发 push 事件，测试要显式启动。
          gh workflow run tests.yml --ref main
